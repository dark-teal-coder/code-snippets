<!DOCTYPE html>

<html lang="en">
	<head>
		<title>Page Title</title>
		<!-- Specify the character encoding for the HTML document to be the UTF-8 character set, which covers almost all characters and symbols. -->
		<meta charset="UTF-8">
		<!-- Add a description of the web page to improve your site's SEO. -->
		<meta name="description" content="Free Web tutorials">
		<!-- Use the viewport (i.e. the visible area of a web page) to control the page's dimensions and scaling to fit fixed size webpages to devices of different screen sizes. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!-- Define keywords for search engines. -->
		<meta name="keywords" content="HTML, CSS, JavaScript">
		<!-- Add the author of the page. -->
		<meta name="author" content="Firstname Lastname">

		<!-- Internal JavaScript -->
		<script>
			// One-line JavaScript comment
			/*
				Multiple-line JavaScript comment
			*/
		</script>

		<!-- External JavaScript -->
		<!-- This links a JavsScript file to the current HTML file. -->
		<script src="filename.js"></script>

		<!-- Internal CSS -->
		<style>
			/* One- or multiple-line CSS comment */
		</style>

		<!-- External CSS -->
		<!-- This links a CSS file to the current HTML file. -->
		<link rel="stylesheet" href="./styles.css">
	</head>
	<body>
		<h1>This is the biggest heading</h1>
		<h6>This is the smallest heading</h6>
		<p>This is a paragraph.</p>
		<!-- The "controls" attribute enables users to manage audio playback, including pausing or resuming playback; "loop" makes the audio replay continuously; "muted" starts the audio in a muted state. -->
		<audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/can't-stay-down.mp3" controls loop muted></audio>
		<!-- Different browsers support different audio types. The browser will select the first compatible source. -->
		<audio controls>
			<source src="audio.ogg" type="audio/ogg" />
			<source src="audio.wav" type="audio/wav" />
			<source src="audio.mp3" type="audio/mpeg" />
		</audio>
		<!-- The "controls" attribute enables users to manage audio playback, including pausing or resuming playback; "loop" makes the audio replay continuously; "muted" starts the audio in a muted state; "autoplay" plays the video automatically; "poster" displays a thumbnail image of the video. -->
		<video src="https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4" controls loop muted autoplay poster="https://peach.blender.org/wp-content/uploads/title_anouncement.jpg?x11217" width="400"></video>
		<!-- Different browsers support different video types. The browser will select the first compatible source. -->
		<video controls width="400" poster="https://peach.blender.org/wp-content/uploads/title_anouncement.jpg?x11217">
			<source
		    	src="https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4"
		    	type="video/mp4"
			/>
		  	<source
		    	src="https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.webm"
		    	type="video/webm"
			/>
		</video>
		<!-- "iframe" embeds an external site on your web page. -->
		<!-- Example of embedded YouTube video -->
		<!-- "accelerometer" lets the iframe use motion sensors so it can detect things like device tilting and rotation, and "clipboard-write" lets the iframe write data to the user's clipboard. -->
		<iframe 
			width="400" 
			height="200" 
			src="https://www.youtube.com/embed/u43gJJrVa1I?si=BoDW_puFsy8OEr_Z" 
			title="Professional Cloud Architect Certification Course – Pass the Exam! (YouTube video)" 
			allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
			referrerpolicy="strict-origin-when-cross-origin" 
			allowfullscreen
		>
		</iframe>
		<!-- Example of embedded map -->
		<iframe
			width="300"
			height="200"
			src="https://www.openstreetmap.org/export/embed.html?bbox=-0.004017949104309083%2C51.47612752641776%2C0.00030577182769775396%2C51.478569861898606&amp;layer=mapnik"
			title="Map of the Royal Observatory, Greenwich, London"
		>
		</iframe>
	</body>
</html>
